<script>
'use strict';
/* ==========================================================================

   Gouraud polygons, perspective-correct point-sampled textures, screen-door
   transparency, and one 256-colour palette with a 4x4 ordered dither.
   ========================================================================== */
const Q = new URLSearchParams(location.search);
const SCALE = Math.max(1, Math.min(3, +Q.get('res') || 1));
const W = 320 * SCALE, H = 240 * SCALE;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const g2 = cv.getContext('2d');
const img = g2.createImageData(W, H);
const OUT = new Uint32Array(img.data.buffer);
const FB = new Float32Array(W * H * 3);
const ZB = new Float32Array(W * H);
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + .5) / 16);

const add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];

/* ---------- camera ---------- */

/* ---------- triangles ---------- */

/* ---------- lines and points ---------- */

/* ==========================================================================

let COAX = [];
function buildCoax() {
  const [fx, fy, fz] = FEED;
  const s = LAPTOP.sma;
  const P = [[fx + .01, fy - .012, fz + .008], [fx + .03, fy - .05, fz + .04], [fx + .04, fy - .2, fz + .05],
    [fx + .03, fy - .34, fz], [s[0] + .07, s[1] + .05, s[2] + .1], [s[0] + .05, s[1] - .02, s[2] + .02], [s[0] + .015, s[1], s[2]], s];
  COAX = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let k = 0; k < 8; k++) {
      const t = k / 8, t2 = t * t, t3 = t2 * t;
      COAX.push([0, 1, 2].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  COAX.push(s);
  let acc = 0; COAX.s = [0];
  for (let i = 1; i < COAX.length; i++) { acc += len(sub(COAX[i], COAX[i - 1])); COAX.s.push(acc); }
  COAX.L = acc;
  for (let i = 0; i + 1 < COAX.length; i++) SLINES.push({ a: COAX[i], b: COAX[i + 1], col: [.05, .05, .055], opt: {} });
}

/* ---------- light: the balcony opening, a dim fill, the screen ---------- */
const LIGHTS = [];
function addLights() {
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++)
    LIGHTS.push({ p: [DOOR.x0 + (DOOR.x1 - DOOR.x0) * (i + .5) / 4, .2 + 2.1 * (j + .5) / 4, ROOM.z1 - .05], d: [0, 0, -1], c: [1, 1, .97], k: .42, cos: true });
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    LIGHTS.push({ p: [-0.75 + i * .4, .4 + j * .85, ANNEX.z1 - .05], d: [0, 0, -1], c: [1, 1, .97], k: .55, cos: true });
}
function lightAt(p, n, ds) {
  const up = n[1];
  let r = .21 + .05 * up, g = .22 + .05 * up, b = .25 + .06 * up;
  for (const L of LIGHTS) {
    const dv = sub(L.p, p), d2 = dot(dv, dv) + .3, l = norm(dv);
    let ndl = dot(n, l); if (ds) ndl = Math.abs(ndl);
    if (ndl <= 0) continue;
    let k = ndl / d2 * L.k;
    if (L.cos) k *= Math.max(0, -dot(L.d, l)) * 1.1 + .05;
    r += L.c[0] * k; g += L.c[1] * k; b += L.c[2] * k;
  }
  if (LAPTOP.screen) {
    const sc = lerp3(LAPTOP.screen[0], LAPTOP.screen[2], .5), dv = sub(sc, p), d2 = dot(dv, dv) + .02;
    const ndl = Math.max(0, dot(n, norm(dv)));
    r += .012 * ndl / d2; g += .016 * ndl / d2; b += .024 * ndl / d2;
  }
  return [r, g, b];
}
function bake() {
  for (const T of TRIS) {
    const m = T.m;
    T.vc = [];
    for (let k = 0; k < 3; k++) {
      let c;
      if (m.emis) c = m.c.slice();
      else {
        const L = lightAt(T.p[k], T.n, m.ds).map(v => v + m.boost);
        c = [m.c[0] * L[0], m.c[1] * L[1], m.c[2] * L[2]];
        if (m.gloss) { // the wet-look floor: a streak of the doorway's reflection
          const p = T.p[k], dz = (ROOM.z1 - p[2]);
          const sx = Math.exp(-Math.pow((p[0] + .38) / (.22 + dz * .07), 2)) * Math.exp(-dz * .5) * .7;
          c = c.map(v => v + sx);
        }
      }
      T.vc.push(c);
    }
  }
}

const VA = new Float64Array(8), VB = new Float64Array(8), VC = new Float64Array(8);
function setV(o, p, c, u, v) {
  view(p, o);
  o[3] = c[0]; o[4] = c[1]; o[5] = c[2]; o[6] = u; o[7] = v;
  return o;
}
function drawStatic() {
  const e = cam.e, f = cam.f;
  for (const T of TRIS) {
    const p = T.p, m = T.m;
    if (!m.ds) { const d0 = sub(e, p[0]); if (dot(d0, T.n) <= 0) continue; }
    // trivial reject: all behind the camera
    if (dot(sub(p[0], e), f) < NEAR && dot(sub(p[1], e), f) < NEAR && dot(sub(p[2], e), f) < NEAR) continue;
    const uv = T.uv;
    drawTri(setV(VA, p[0], T.vc[0], uv[0], uv[1]), setV(VB, p[1], T.vc[1], uv[2], uv[3]), setV(VC, p[2], T.vc[2], uv[4], uv[5]), m.tex, m.alpha, OPAQUE);
  }
  for (const L of SLINES) line3(L.a, L.b, L.col, L.opt);
}
function drawSky() {
  // gradient behind everything (no depth): the sky seen past the balcony
  for (let y = 0; y < H; y++) {
    const t = y / H;
    const c = [.86 + .06 * t, .9 + .04 * t, .93 + .03 * t];
    for (let x = 0; x < W; x++) { const o = (y * W + x) * 3; FB[o] = c[0]; FB[o + 1] = c[1]; FB[o + 2] = c[2]; }
  }
}

let PAL = null, LUT = null, PAL32 = null;

// the coax: a wave travelling from the feed to the receiver, its wavelength shortened by VF
function drawCoax(VL, ref, ph) {
  const m = Math.hypot(VL[0], VL[1]) / ref;
  if (m < .02) return;
  for (let i = 0; i + 1 < COAX.length; i++) {
    const s = (COAX.s[i] + COAX.s[i + 1]) / 2, a = KW / VF * s - ph;
    const v = (VL[0] * Math.cos(a) - VL[1] * Math.sin(a)) / ref;     // Re(VL e^{i(k s - ph)})
    if (v <= 0) continue;
    xline(COAX[i], COAX[i + 1], [1, .7, .3].map(c => c * v * .9), { mode: ADD, bias: 1.05 });
  }
}
// a reply on its way, as the limbs of its spherical pulse fronts seen from the eye
function drawShells(srcW, te, bits, t, col, alpha) {
  if (alpha <= .02) return;
  const edges = [0, 1, 3.5, 4.5, 8 + bits.length];
  const E = cam.e, D = len(sub(E, srcW)), ax = norm(sub(E, srcW));
  const u = norm(cross(ax, [0, 1, 0])), v = cross(ax, u);
  for (let n = 0; n < edges.length; n++) {
    const Rs = C0 * (t - te - edges[n] * 1e-6);
    if (Rs <= 0 || Rs >= D) continue;
    const q = Rs / D, ctr = add(srcW, mul(sub(E, srcW), q * q)), rad = Rs * Math.sqrt(1 - q * q);
    const a = alpha * (n < 4 ? .95 : .4) * (1 - q * q * .5);
    let prev = null;
    for (let i = 0; i <= 72; i++) {
      const th = i / 72 * TAU, p = add(ctr, add(mul(u, rad * Math.cos(th)), mul(v, rad * Math.sin(th))));
      if (prev) line3(prev, p, col, { alpha: a, nodepth: true });
      prev = p;
    }
  }
}
// the antenna's line of sight to the sky: from the feed through the clear part of the doorway and
// the balcony glass, down to the hill's crown
const WINDOW = (function () {
  const az = (x, z) => Math.atan2(x - FEED[0], z - FEED[2]);
  const a0 = Math.max(az(DOOR.x0, ROOM.z1), az(GLASS.x0, ANNEX.z1)), a1 = Math.min(az(DOOR.x1, ROOM.z1), az(GLASS.x1, ANNEX.z1));
  const top = a => Math.min(Math.atan2(DOOR.top - FEED[1], (ROOM.z1 - FEED[2]) / Math.cos(a)), Math.atan2(GLASS.top - FEED[1], (ANNEX.z1 - FEED[2]) / Math.cos(a)));
  const dir = (a, e) => [Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e)];
  const n = 8, rim = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; rim.push(dir(a, top(a))); }
  for (let i = n; i >= 0; i--) { const a = a0 + (a1 - a0) * i / n; rim.push(dir(a, hillEl(a))); }
  return { rim, a0, a1 };
})();
function drawWindow(alpha) {
  if (alpha <= .02) return;
  const far = 125, col = TEAL.map(c => c * .55);
  const ends = WINDOW.rim.map(d => add(FEED, mul(d, far / Math.max(.2, Math.hypot(d[0], d[2])))));
  for (let i = 0; i < ends.length; i++) {
    line3(ends[i], ends[(i + 1) % ends.length], col.map(v => v * .6), { alpha: alpha * .6, nodepth: true, dash: dots });
    line3(ends[i], ends[(i + 1) % ends.length], col, { alpha: alpha * .8 });
  }
  for (const i of [0, 8, 9, 17]) {
    line3(FEED, ends[i], col.map(v => v * .5), { alpha: alpha * .5, dash: dots, nodepth: true });
    line3(FEED, ends[i], col, { alpha: alpha * .7, dash: dashes });
  }
}

/* ==========================================================================
   The camera: the photograph's own view, easing a little closer while time is slowed
   ========================================================================== */
const shotDir = (yaw, pitch) => [Math.sin(yaw * D2R) * Math.cos(pitch * D2R), -Math.sin(pitch * D2R), Math.cos(yaw * D2R) * Math.cos(pitch * D2R)];
const P0 = { e: [0, 1.35, 0], d: shotDir(5, 8), f: 76 };
const PZ = { e: [0.06, 1.38, 0.1], d: shotDir(11, 1), f: 70 };
const ease = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
function camAt(T) {
  const u = ease((T - 15) / 7) * (1 - ease((T - 33.5) / 7));
  const e = lerp3(P0.e, PZ.e, u), d = norm(lerp3(P0.d, PZ.d, u));
  return { e, t: add(e, mul(d, 3)), f: P0.f + (PZ.f - P0.f) * u };
}
function overlays(T) {
  const inS = (a, b, c, d) => smooth(a, b, T) * (1 - smooth(c, d, T));
  return {
    window: .45 * smooth(2, 6, T) * (1 - smooth(51, 53.5, T)) + .55 * inS(14, 16.5, 37, 40),
    shells: inS(17.5, 18.3, 22.6, 23.6),
    fence: inS(21.5, 22.4, 31.5, 33.5),
    pattern: inS(24.5, 26.2, 31.5, 33.5),
  };
}

/* ==========================================================================
   Frame and loop
   ========================================================================== */
function dimWorld(k) {
  if (k <= 0) return;
  const m = 1 - .42 * k, sat = 1 - .5 * k;
  for (let i = 0; i < W * H * 3; i += 3) {
    const l = (FB[i] * .3 + FB[i + 1] * .55 + FB[i + 2] * .15);
    FB[i] = (l + (FB[i] - l) * sat) * m; FB[i + 1] = (l + (FB[i + 1] - l) * sat) * m; FB[i + 2] = (l + (FB[i + 2] - l) * sat) * m * 1.04;
  }
}
function fade(k) { if (k >= 1) return; for (let i = 0; i < W * H * 3; i++) FB[i] *= k; }
function renderAt(Tall) {
  const T = ((Tall % LOOP) + LOOP) % LOOP, t = simLocal(T), ph = TAU * F_VIS * Tall;
  const s = camAt(T);
  setCam(s.e, s.t, s.f);
  ZB.fill(0);
  drawSky();
  drawStatic();
  drawScreenDyn(t);
  drawScreen();
  const states = AC.map(a => { const st = acState(a, t); st.link = link(st); return st; });
  drawAircraft(states, T, t);
  dimWorld(smooth(-1.5, -5, logRate(T)) * 1.25);
  const ov = overlays(T);
  drawWindow(ov.window);
  drawReplies(states, T, t);
  // the two replies this film follows
  const hs = states[0], ds = states[4];
  drawShells(acState(HERO, HERO_TE).w, HERO_TE, HERO_BITS, t, altColor(hs.alt), ov.shells);
  drawShells(acState(DEP, DEP_TE).w, DEP_TE, DEP_BITS, t, altColor(ds.alt).map(c => c * .8), ov.shells);
  const dTau = (t - (DEP_TE + (acState(DEP, DEP_TE).R - 125) / C0)) * 1e6;
  if (dTau > 0 && dTau < 121) {
    const k = envelope(DEP_BITS, dTau) * .6 + .4;
    if (ds.link.path.hit) fadeRay(ds.link.path.hit, norm(sub(ds.w, FEED)), 40, altColor(ds.alt).map(c => c * .5), { dash: dots, nodepth: true });
    mark(ds.link.path.hit || FEED, altColor(ds.alt).map(c => c * k * 1.2), 'x', true);
  }
  const hTau = (t - SIM_ARR) * 1e6;
  let Ic = null, peak = 1, src = null, env = 0;
  if (hTau > -.2 && hTau < 121) {
    src = makeSource(mul(hs.p, -1 / hs.R), 1);
    env = envelope(HERO_BITS, hTau);
    let envS = 0; for (let i = 0; i < 16; i++) envS += envelope(HERO_BITS, hTau - i * .25); envS = Math.min(1, envS / 16 * 2);
    Ic = [src.I0[0] * envS, src.I0[1] * envS];
    peak = Math.hypot(src.I0[0], src.I0[1]);
    let avg = 0; for (let i = 0; i < 12; i++) avg += envelope(HERO_BITS, hTau - i * .5); avg /= 12;
    const hd = norm(sub(hs.w, FEED));
    fadeRay(FEED, hd, RAY_L, altColor(hs.alt).map(c => c * (.15 + .35 * avg)), { dash: dots, nodepth: true });
    fadeRay(FEED, hd, RAY_L, altColor(hs.alt).map(c => c * (.25 + .75 * avg)), { bias: 1.002 });
    drawFence(src, env, ph, ov.fence);
    drawCoax([src.VL[0] * env, src.VL[1] * env], Math.hypot(src.VL[0], src.VL[1]), ph);
  }
  drawCurrent(Ic, peak, ph);
  drawPattern(ov.pattern);
  fade(Math.min(smooth(0, .7, T), 1 - smooth(LOOP - .8, LOOP, T)));
  return { T, t };
}
function drawScreen() {
  const s = LAPTOP.screen;
  const n = norm(cross(sub(s[1], s[0]), sub(s[3], s[0])));
  const vdir = norm(sub(cam.e, lerp3(s[0], s[2], .5)));
  const k = .45 + .65 * Math.abs(dot(n, vdir));
  const c = [1.05 * k, 1.05 * k, 1.1 * k];
  drawTri(setV(VA, s[0], c, 0, 0), setV(VB, s[1], c, 1, 0), setV(VC, s[2], c, 1, 1), SCREEN, 1, OPAQUE);
  drawTri(setV(VA, s[0], c, 0, 0), setV(VB, s[2], c, 1, 1), setV(VC, s[3], c, 0, 1), SCREEN, 1, OPAQUE);
}

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', resize); resize();

(function init() {
  drawScreenBase();
  const hist = new Uint32Array(32768);
  for (const T of [2, 10, 19.5, 20.4, 22.05, 24.4, 27.5, 30, 33, 40, 44, 50]) { renderAt(T); histFrame(hist); }
  buildPalette(hist);
  const fixed = Q.get('t');
  const t0 = performance.now();
  function loop() {
    const T = fixed != null ? +fixed : (performance.now() - t0) / 1000;
    renderAt(T); present();
    if (fixed == null) requestAnimationFrame(loop); else document.title = 'ready';
  }
  loop();
})();
</script>
</body>
</html>
