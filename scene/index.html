<script>
'use strict';
/* ==========================================================================

   Gouraud polygons, perspective-correct point-sampled textures, screen-door
   transparency, and one 256-colour palette with a 4x4 ordered dither.
   ========================================================================== */
const Q = new URLSearchParams(location.search);
const SCALE = Math.max(1, Math.min(3, +Q.get('res') || 1));
const W = 320 * SCALE, H = 240 * SCALE;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const g2 = cv.getContext('2d');
const img = g2.createImageData(W, H);
const OUT = new Uint32Array(img.data.buffer);
const FB = new Float32Array(W * H * 3);
const ZB = new Float32Array(W * H);
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + .5) / 16);

const add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];

/* ---------- camera ---------- */

/* ---------- triangles ---------- */
const PA = new Float64Array(8), PB = new Float64Array(8), PC = new Float64Array(8);

/* ---------- lines and points ---------- */

/* ==========================================================================

/* ---------- palette: median cut over sampled frames, then a 32^3 lookup ---------- */
let PAL = null, LUT = null, PAL32 = null;
const tone = x => x <= 0 ? 0 : 1 - Math.exp(-x * 1.25);
function histFrame(hist) {
  for (let i = 0; i < W * H; i++) {
    const r = tone(FB[i * 3]), g = tone(FB[i * 3 + 1]), b = tone(FB[i * 3 + 2]);
    hist[((r * 31.99) | 0) << 10 | ((g * 31.99) | 0) << 5 | ((b * 31.99) | 0)]++;
  }
}
function buildPalette(hist, n = 256) {
  let cols = [];
  for (let i = 0; i < 32768; i++) if (hist[i]) cols.push([(i >> 10) & 31, (i >> 5) & 31, i & 31, Math.sqrt(hist[i])]);
  let boxes = [cols];
  while (boxes.length < n) {
    // split the box with the largest weighted extent
    let bi = -1, best = 0, baxis = 0;
    boxes.forEach((B, i) => {
      if (B.length < 2) return;
      let w = 0; for (const c of B) w += c[3];
      for (let a = 0; a < 3; a++) {
        let lo = 99, hi = -1; for (const c of B) { if (c[a] < lo) lo = c[a]; if (c[a] > hi) hi = c[a]; }
        const s = (hi - lo) * Math.sqrt(w) * [1.0, 1.2, .9][a];
        if (s > best) { best = s; bi = i; bax = a; }
      }
    });
    var bax;
    if (bi < 0) break;
    const B = boxes[bi]; B.sort((p, q) => p[bax] - q[bax]);
    let tot = 0; for (const c of B) tot += c[3];
    let acc = 0, k = 0; while (k < B.length - 1 && acc + B[k][3] < tot / 2) acc += B[k++][3];
    k = Math.max(1, k);
    boxes.splice(bi, 1, B.slice(0, k), B.slice(k));
  }
  PAL = boxes.map(B => { let r = 0, g = 0, b = 0, w = 0; for (const c of B) { r += c[0] * c[3]; g += c[1] * c[3]; b += c[2] * c[3]; w += c[3]; } return [r / w / 31, g / w / 31, b / w / 31]; });
  while (PAL.length < n) PAL.push([PAL.length / n, PAL.length / n, PAL.length / n]);
  PAL32 = new Uint32Array(PAL.map(c => (255 << 24) | (Math.round(c[2] * 255) << 16) | (Math.round(c[1] * 255) << 8) | Math.round(c[0] * 255)));

  for (let i = 0; i < 32768; i++) {
    const r = ((i >> 10) & 31) / 31, g = ((i >> 5) & 31) / 31, b = (i & 31) / 31;
    let bi = 0, bd = 1e9;
    for (let k = 0; k < PAL.length; k++) { const c = PAL[k]; const d = 2 * (c[0] - r) ** 2 + 4 * (c[1] - g) ** 2 + 3 * (c[2] - b) ** 2; if (d < bd) { bd = d; bi = k; } }
    LUT[i] = bi;
  }
}

/* ==========================================================================
   Physics. Computed, not drawn to taste.
   - 1090 MHz; lambda = c / f.
   - The dipole: centre-fed, thin, its current I0 sin k(h - |z|) with kh = pi/2;
     the exact near field of that current (Balanis, Antenna Theory, 8.2).
   - Reception by the induced EMF: Voc = E0 (2/k)[cos(kh cos t) - cos kh]/(sin t sin kh),
     I = Voc / (Za + Zl), the resonant dipole's 73 ohms into the receiver's 50.
   - Mode S extended squitters (DF17) with their real CRC-24 and CPR position,
     acquisition squitters (DF11), propagation in free space at c.
   Phasors are e^{-i w t}. Field maths runs in a right-handed frame P = (x, z, y)
   of the world with its origin at the feed point, Z up the antenna.
   ========================================================================== */
const C0 = 299792458, FREQ = 1090e6, KW = TAU / LAMBDA, ETA = 376.730313668;
const HE = LAMBDA / 4, KH = KW * HE, COSKH = Math.cos(KH), SINKH = Math.sin(KH);
const ZA = 73.1, ZL = 50, VF = 0.66;            // RG-174 velocity factor
const AZ_ROOM = 150 * Math.PI / 180;            // the bearing the room faces, toward the balcony
const toPhys = w => [w[0] - FEED[0], w[2] - FEED[2], w[1] - FEED[1]];
const toWorld = p => [p[0] + FEED[0], p[2] + FEED[1], p[1] + FEED[2]];
const vWorld = p => [p[0], p[2], p[1]];
const enuToPhys = (e, n, u) => [e * Math.cos(AZ_ROOM) - n * Math.sin(AZ_ROOM), e * Math.sin(AZ_ROOM) + n * Math.cos(AZ_ROOM), u];
const physToEN = p => [p[0] * Math.cos(AZ_ROOM) + p[1] * Math.sin(AZ_ROOM), -p[0] * Math.sin(AZ_ROOM) + p[1] * Math.cos(AZ_ROOM)];
const crossR = cross;   // the component formula; in the right-handed P frame it is the physical cross product

// pattern of the thin dipole, t from its axis
function patF(ct) { const st = Math.sqrt(Math.max(1e-9, 1 - ct * ct)); return (Math.cos(KH * ct) - COSKH) / st; }

// a plane wave arriving with unit propagation vector k (P frame), its E in the vertical plane
// through k (the aircraft's antenna is a vertical monopole), amplitude E0 at the feed
function makeSource(k, E0) {
  const up = [0, 0, 1];
  let e = sub(up, mul(k, dot(up, k))); e = norm(e);
  const h = crossR(k, e);                        // H = (1/eta) k x E
  const ct = -k[2];                              // cosine of the angle between the antenna and the direction to the source
  const st = Math.sqrt(Math.max(1e-9, 1 - ct * ct));
  const voc = E0 * (2 / KW) * (Math.cos(KH * ct) - COSKH) / (st * SINKH);
  const Iin = voc / (ZA + ZL);
  return { k, e, h, E0, I0: Iin / SINKH, Iin, VL: Iin * ZL };
}
// total field (incident + the dipole's re-radiation) at P; returns 12 numbers: E re/im xyz, H re/im xyz
const FLD = new Float64Array(12);
function fieldAt(P, s, env) {

function drawScreenDyn(t, Tloc) {
  const stamp = Math.floor(t / 2);
  const clockSec = Math.floor(t);
  if (stamp === scopeStamp && SCREEN.sec === clockSec) return;
  SCREEN.r.set(SBASE.r); SCREEN.g.set(SBASE.g); SCREEN.b.set(SBASE.b);
  // the clock: big digits as blocks that change with the seconds
  const R = rng(clockSec);
  for (let d = 0; d < 4; d++) for (let k = 0; k < 6; k++) if (hash2(clockSec >> (d === 3 ? 0 : 6), d * 7 + k) > .3) sRect(14 + d * 15 + (d > 1 ? 6 : 0) + (k % 2) * 6, 25 + Math.floor(k / 2) * 6, 6, 6, [.95, .95, .95]);
  sRect(44, 31, 2, 2, [1, 1, 1]); sRect(44, 39, 2, 2, [1, 1, 1]);
  sRect(76, 24, 10, 8, [.9, .9, .9].map(v => v * (.7 + .3 * R())));
  sRect(12, 47, 76, 7, [.85, .85, .85]);
  scopeStamp = stamp; SCREEN.sec = clockSec;
  const tt = stamp * 2;
  const k = heroLoop(tt);
  const decodedHero = tt > k * SIM_LOOP + SIM_ARR + 125e-6;
  const { cx, cy, r, rangeM } = SCOPE;
  for (const a of aircraftAt(tt)) {
    if (a.hero >= 0 && (a.hero > k || (a.hero === k && !decodedHero))) continue;
    const d = Math.hypot(a.en[0], a.en[1]);
    if (d > rangeM) continue;
    const col = altColor(a.alt), dim = col.map(v => v * .45);
    const x = cx + a.en[0] / rangeM * r, y = cy - a.en[1] / rangeM * r;
    // the trail: where it was over the past minute
    const tx = cx + (a.en[0] - Math.sin(a.trk) * 236 * 60) / rangeM * r, ty = cy - (a.en[1] - Math.cos(a.trk) * 236 * 60) / rangeM * r;
    sLine(tx, ty, x, y, dim);
    const s = Math.sin(a.trk), c = Math.cos(a.trk);
    sPix(x, y, col); sPix(x + s, y - c, col); sPix(x - c * .9 - s * .5, y - s * .9 + c * .5, col); sPix(x + c * .9 - s * .5, y + s * .9 + c * .5, col);
  }
}

/* ==========================================================================
   What is drawn of the field
   ========================================================================== */
const AMBER = [1.0, .66, .22], TEAL = [.25, .85, .95], CREAM = [1, .93, .78], PLUS = [1, .33, .16], MINUS = [.25, .45, 1];
// the hedgehog: E at a square of points in the antenna's equatorial plane, two wavelengths a side,
// aligned with the hero's direction of arrival
const GRID = (function () {
  const kh = norm([-HERO.ref[0], -HERO.ref[1], 0]), side = [kh[1], -kh[0], 0];
  const n = 9, pts = [], fence = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const u = (i / (n - 1) - .5) * 2 * LAMBDA, v = (j / (n - 1) - .5) * 2 * LAMBDA;
    const P = add(mul(kh, u), mul(side, v));
    if (j === (n >> 1) || Math.hypot(P[0], P[1]) < .012) continue;
    pts.push({ P, w: toWorld(P), edge: Math.min(1, (LAMBDA * 1.05 - Math.max(Math.abs(u), Math.abs(v))) / (LAMBDA * .4)) });
  }
  // the fence: E and H along the line of arrival through the feed, sixteen samples a wavelength
  for (let i = -16; i <= 16; i++) {
    const u = i / 16 * LAMBDA, P = mul(kh, u);
    if (Math.abs(u) < .008) continue;
    fence.push({ P, w: toWorld(P), edge: Math.min(1, (LAMBDA * 1.05 - Math.abs(u)) / (LAMBDA * .35)) });
  }
  return { pts, fence, kh, side };
})();
// Poynting streamlines of the hero's wave in the same plane, time-averaged: where the energy the
// receiver takes comes from. Computed once.
const STREAMS = (function () {
  const s = makeSource(norm(mul(HERO.ref, -1)), 1);
  const lines = [];
  for (let i = -9; i <= 9; i++) {
    let P = add(mul(GRID.kh, -1.15 * LAMBDA), mul(GRID.side, i * LAMBDA / 26));
    const pts = [P], step = LAMBDA / 140;
    let caught = false;
    for (let n = 0; n < 900; n++) {
      const dir = (Q) => { const S = poynting(fieldAt(Q, s, 1)); return norm([S[0], S[1], 0]); };
      const k1 = dir(P), k2 = dir(add(P, mul(k1, step / 2))), k3 = dir(add(P, mul(k2, step / 2))), k4 = dir(add(P, mul(k3, step)));
      P = add(P, mul(add(add(k1, mul(k2, 2)), add(mul(k3, 2), k4)), step / 6));
      pts.push(P);
      if (Math.hypot(P[0], P[1]) < .006) { caught = true; break; }
      if (dot(P, GRID.kh) > 1.15 * LAMBDA || Math.abs(dot(P, GRID.side)) > 1.2 * LAMBDA) break;
    }
    lines.push({ pts: pts.map(toWorld), caught, s: pts.map((_, k) => k * step) });
  }
  return lines;
})();

// one frame of field drawing at sim time t, strobe phase ph
function drawField(msgs, ph, view) {
  if (!msgs.length) return;
  const cph = Math.cos(ph), sph = Math.sin(ph);
  // the dipole's own current and charge, the sum over what is arriving
  let Ir = 0, Ii = 0;
  for (const m of msgs) { Ir += m.src.I0 * m.env; }
  const peak = Math.abs(makeSource(norm(mul(HERO.ref, -1)), E_REF).I0);
  // hedgehog
  const vs = .055 / E_REF;
  const sample = (g) => {
    let ex = 0, ey = 0, ez = 0, hx = 0, hy = 0, hz = 0;
    for (const m of msgs) {
      if (m.env < 1e-3) continue;
      const F = fieldAt(g.P, m.src, m.env);
      ex += F[0] * cph + F[3] * sph; ey += F[1] * cph + F[4] * sph; ez += F[2] * cph + F[5] * sph;
      hx += F[6] * cph + F[9] * sph; hy += F[7] * cph + F[10] * sph; hz += F[8] * cph + F[11] * sph;
    }
    return [vWorld([ex * vs, ey * vs, ez * vs]), vWorld([hx * vs * ETA, hy * vs * ETA, hz * vs * ETA])];
  };
  for (const g of GRID.pts) {
    const fade = g.edge * view.gridA;
    if (fade <= 0.03) continue;
    const [e] = sample(g), mag = len(e) / (vs * E_REF);
    if (mag < .03) continue;
    line3(g.w, add(g.w, e), AMBER.map(c => c * fade * (.25 + .6 * Math.min(1, mag))), { bias: 1.02 });
  }
  const fA = Math.max(view.fenceA, view.gridA * .8);
  if (fA > .03) for (const g of GRID.fence) {
    const [e, hv] = sample(g), mag = len(e) / (vs * E_REF);
    if (mag < .03) continue;
    const k = g.edge * fA * (.4 + .8 * Math.min(1, mag));
    line3(g.w, add(g.w, e), AMBER.map(c => c * k * 1.2), { bias: 1.02 });
    if (view.fenceA > .03) line3(g.w, add(g.w, hv), TEAL.map(c => c * k), { alpha: view.fenceA, bias: 1.02 });
  }
  if (fA > .03) { const a = GRID.fence[0].w, b = GRID.fence[GRID.fence.length - 1].w; line3(a, b, AMBER.map(c => c * .3 * fA), { bias: 1.02, dash: tt => (tt * 66 | 0) % 2 === 0 }); }
  // crest lines of the incident wave across the plane
  if (view.crestA > 0) for (const m of msgs) {
    if (!m.hero || m.env < .02) continue;
    const kh = norm([m.src.k[0], m.src.k[1], 0]), sd = [kh[1], -kh[0], 0], kz = Math.hypot(m.src.k[0], m.src.k[1]);
    for (let c = -3; c <= 3; c++) {
      const u = (ph / TAU + c) * LAMBDA / kz;               // phase k u kz - ph = 2 pi c
      if (Math.abs(u) > LAMBDA * .98) continue;
      const a = toWorld(add(mul(kh, u), mul(sd, -LAMBDA * .98))), b = toWorld(add(mul(kh, u), mul(sd, LAMBDA * .98)));
      line3(a, b, AMBER, { alpha: view.crestA * m.env * .55, bias: 1.02, dash: tt => (tt * 40 | 0) % 2 === 0 });
    }
  }
  // the antenna: current along the arms, charge at the ends
  const Inow = Ir * cph;                                  // Re(I e^{-i ph}), the sources' I0 are real here
  const Qnow = Ir * sph;                                  // the charge leads by a quarter cycle
  const nseg = 14;
  for (const dir of [1, -1]) for (let s = 0; s < nseg; s++) {
    const z0 = s / nseg * HE, z1 = (s + 1) / nseg * HE;
    const iz = Math.sin(KW * (HE - (z0 + z1) / 2)) * Inow / peak;
    const k = Math.min(1.4, Math.abs(iz));
    if (k < .02) continue;
    const a = [FEED[0], FEED[1] + dir * (.02 + (ARM - .02) * z0 / HE), FEED[2]], b = [FEED[0], FEED[1] + dir * (.02 + (ARM - .02) * z1 / HE), FEED[2]];
    const col = [1, .85, .55].map(c => c * k * 1.3);
    line3(a, b, col, { mode: ADD, bias: 1.05 });
    for (const o of [[.0025, 0, 0], [-.0025, 0, 0], [0, 0, .0025], [0, 0, -.0025]]) line3(add(a, o), add(b, o), col.map(c => c * .45), { mode: ADD, bias: 1.05 });
  }
  // little arrowheads for the current's direction, halfway up each arm
  if (Math.abs(Inow / peak) > .15) for (const dir of [1, -1]) {
    const y = FEED[1] + dir * ARM * .5, up = Inow > 0 ? 1 : -1, s = .006 * Math.min(1, Math.abs(Inow / peak));
    const p = [FEED[0], y + up * s, FEED[2]];
    line3(p, [FEED[0] - s, y - up * s * .4, FEED[2] + s * .3], [1, .9, .6], { mode: ADD, bias: 1.05 });
    line3(p, [FEED[0] + s, y - up * s * .4, FEED[2] - s * .3], [1, .9, .6], { mode: ADD, bias: 1.05 });
  }
  const q = Qnow / peak;
  for (const dir of [1, -1]) {
    const tipq = q * dir, col = tipq > 0 ? PLUS : MINUS, k = Math.min(1, Math.abs(tipq));
    if (k < .05) continue;
    const c = [FEED[0], FEED[1] + dir * ARM, FEED[2]];
    for (let r = 0; r < 3; r++) { const rr = .004 + r * .004 * k; for (let a = 0; a < 8; a++) { const a0 = a / 8 * TAU, a1 = (a + 1) / 8 * TAU; line3([c[0] + rr * Math.cos(a0), c[1] + rr * Math.sin(a0), c[2]], [c[0] + rr * Math.cos(a1), c[1] + rr * Math.sin(a1), c[2]], col.map(v => v * k * (1 - r * .3)), { mode: ADD, bias: 1.05 }); } }
  }
  // the coax: a travelling wave from the feed to the receiver, its wavelength shortened by the
  // velocity factor
  const VLnow = msgs.reduce((acc, m) => acc + m.src.VL * m.env, 0), VLp = makeSource(norm(mul(HERO.ref, -1)), E_REF).VL;
  if (Math.abs(VLnow / VLp) > .02) for (let i = 0; i + 1 < COAX.length; i++) {
    const s = (COAX.s[i] + COAX.s[i + 1]) / 2;
    const v = (VLnow / VLp) * Math.cos(KW / VF * s - ph);
    if (v <= 0) continue;
    line3(COAX[i], COAX[i + 1], [1, .7, .3].map(c => c * v * .9), { mode: ADD, bias: 1.05 });
  }
}
function drawStreams(alpha, Tg) {
  if (alpha <= 0) return;
  for (const L of STREAMS) {
    const P = L.pts;
    for (let i = 0; i + 1 < P.length; i += 2) {
      const s = L.s[i];
      const on = ((s - Tg * .045) / .03 % 1 + 1) % 1 < .3;
      if (!on && !L.caught) continue;
      const k = on ? (L.caught ? 1.05 : .5) : .3;
      line3(P[i], P[Math.min(P.length - 1, i + 2)], CREAM.map(c => c * k), { alpha: alpha, bias: 1.02 });
    }
  }
}
// the reception pattern of the dipole as a wireframe of revolution: |F(t)| / F(90)
function drawPattern(alpha) {
  if (alpha <= 0) return;
  const Rd = .13, nt = 12, np = 16, f90 = patF(0);
  const P = (t, p) => { const ct = Math.cos(t), st = Math.sin(t), r = Rd * Math.abs(patF(ct)) / f90; return toWorld([r * st * Math.cos(p), r * st * Math.sin(p), r * ct]); };
  for (let j = 1; j < nt; j++) for (let i = 0; i < np; i++) {
    const t = j / nt * Math.PI, p0 = i / np * TAU, p1 = (i + 1) / np * TAU;
    line3(P(t, p0), P(t, p1), TEAL.map(c => c * .6), { alpha: alpha * .45 });
  }
  for (let i = 0; i < np; i += 2) for (let j = 0; j < nt; j++) {
    const p = i / np * TAU, t0 = j / nt * Math.PI, t1 = (j + 1) / nt * Math.PI;
    line3(P(t0, p), P(t1, p), TEAL.map(c => c * .6), { alpha: alpha * .45 });
  }
}
// the hero's message on its way, as the limbs of its spherical pulse fronts seen from the eye
function drawShells(t, alpha) {
  if (alpha <= 0) return;
  const k = heroLoop(t);
  const te = heroEmit(k), src = toWorld(heroPos(k, te));
  const bits = heroBits(k);
  // the four preamble pulses' fronts, and the back of the last bit: the message is 36 km thick
  const edges = [0, 1, 3.5, 4.5, 8 + bits.length];
  const E = cam.e, D = len(sub(E, src)), ax = norm(sub(E, src));
  const u = norm(cross(ax, [0, 1, 0])), v = cross(ax, u);
  for (let n = 0; n < edges.length; n++) {
    const Rs = C0 * (t - te - edges[n] * 1e-6);
    if (Rs <= 0 || Rs >= D) continue;
    const q = Rs / D, ctr = add(src, mul(sub(E, src), q * q)), rad = Rs * Math.sqrt(1 - q * q);
    const a = alpha * (n < 4 ? .95 : .4) * (1 - q * q * .5);
    const N = 72;
    let prev = null;
    for (let i = 0; i <= N; i++) {
      const th = i / N * TAU, p = add(ctr, add(mul(u, rad * Math.cos(th)), mul(v, rad * Math.sin(th))));
      if (prev) line3(prev, p, AMBER, { alpha: a, nodepth: true });
      prev = p;
    }
  }
}
function drawAircraft(all, t) {
  for (const a of all) {
    const w = toWorld(a.p);
    // anti-collision beacon (red, ~1 Hz) and wingtip strobes (white double flash), in sim time
    const ph = (t + a.seed * .37) % 1.2;
    const strobe = ph < .05 || (ph > .12 && ph < .17);
    const beacon = ((t + a.seed * .19) % 1) < .12;
    const col = strobe ? [1.4, 1.4, 1.4] : beacon ? [1.3, .15, .1] : [.3, .32, .36];
    point3(w, col, { bias: 1 });
  }
}

/* ==========================================================================
   The camera's path
   ========================================================================== */
const D2R = Math.PI / 180;
const P0 = { e: [0, 1.35, 0], t: [Math.sin(5 * D2R) * 3, 1.35 - Math.sin(8 * D2R) * 3, Math.cos(5 * D2R) * 3], f: 76 };
const P1 = { e: [0.06, 1.38, 0.22], t: [0.45, 1.2, 3.2], f: 72 };
const SA = { e: [0.22, 1.86, 0.25], t: [0.83, 1.34, 3.14], f: 66 };
const SB = { e: add(FEED, [-0.34, 0.26, -0.20]), t: add(FEED, [0.02, -0.06, 0.02]), f: 56 };
function lerpShot(a, b, u) { return { e: lerp3(a.e, b.e, u), t: lerp3(a.t, b.t, u), f: a.f + (b.f - a.f) * u }; }
const ease = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
function orbit(u) {   // from SA round to SB about the feed
  const oa = sub(SA.e, FEED), ob = sub(SB.e, FEED);
  const a0 = Math.atan2(oa[0], oa[2]), a1 = Math.atan2(ob[0], ob[2]);
  const r0 = Math.hypot(oa[0], oa[2]), r1 = Math.hypot(ob[0], ob[2]);
  const a = a0 + (a1 - a0) * u, r = r0 + (r1 - r0) * u, y = oa[1] + (ob[1] - oa[1]) * u;
  return { e: add(FEED, [r * Math.sin(a), y, r * Math.cos(a)]), t: lerp3(SA.t, SB.t, ease(Math.min(1, u * 1.8))), f: SA.f + (SB.f - SA.f) * u };
}
let SC = null, SM = null, SC2 = null;
function shotsAfterBuild() {
  const s = LAPTOP.screen;
  const at = (u, v) => lerp3(lerp3(s[0], s[1], u), lerp3(s[3], s[2], u), v);
  let n = norm(cross(sub(s[1], s[0]), sub(s[3], s[0])));
  if (dot(n, sub(P0.e, s[0])) < 0) n = mul(n, -1);
  const scope = at(.6, .16);
  SC = { e: add(add(scope, mul(n, .13)), [0.01, .015, 0]), t: scope, f: 52 };
  const mid = at(.5, .5);
  SM = { e: add(add(mid, mul(n, .42)), [0.03, .14, 0]), t: lerp3(mid, FEED, .35), f: 60 };
  // the push-in ends on the spot where this loop's airliner will first be drawn
  const en = physToEN(heroPos(0, SIM_ARR + 1.7));
  const hpt = at((SCOPE.cx + en[0] / SCOPE.rangeM * SCOPE.r) / SW, (SCOPE.cy - en[1] / SCOPE.rangeM * SCOPE.r) / SH);
  SC2 = { e: add(add(lerp3(scope, hpt, .6), mul(n, .085)), [0.004, .008, 0]), t: lerp3(scope, hpt, .75), f: 48 };
}
function camAt(T) {
  let s;
  if (T < 7) s = lerpShot(P0, P1, ease(T / 7) * .3);
  else if (T < 16.5) s = lerpShot(lerpShot(P0, P1, .3), SA, ease((T - 7) / 9.5));
  else if (T < 22.6) s = SA;
  else if (T < 28) s = orbit(ease((T - 22.6) / 5.4));
  else if (T < 31) s = SB;
  else if (T < 33.5) s = lerpShot(SB, SM, ease((T - 31) / 2.5));
  else if (T < 36) s = lerpShot(SM, SC, ease((T - 33.5) / 2.5));
  else if (T < 42) s = lerpShot(SC, SC2, ease((T - 36) / 6));
  else s = lerpShot(SC2, P0, ease((T - 42) / (LOOP - 42 - 1.5)));
  return s;
}
// how much of each overlay to show, by story time
function overlays(T) {
  const inS = (a, b, c, d) => smooth(a, b, T) * (1 - smooth(c, d, T));
  return {
    gridA: .5 + .5 * inS(24, 26.5, 31, 33),
    fenceA: inS(21.5, 22.5, 31, 33),
    crestA: inS(21.5, 22.5, 31, 33),
    streamA: inS(27.2, 28.6, 31, 33),
    patternA: inS(25, 26.5, 28, 29.2),
    shellA: inS(17.5, 18.2, 22.5, 23.5),
  };
}

/* ==========================================================================
   Frame and loop
   ========================================================================== */
function renderAt(Tall) {
  const loop = Math.floor(Tall / LOOP), T = Tall - loop * LOOP;
  const t = loop * SIM_LOOP + simLocal(T);
  const ph = TAU * F_VIS * Tall;
  const s = camAt(T);
  setCam(s.e, s.t, s.f);
  ZB.fill(0);
  drawSky();
  drawStatic();
  drawScreenDyn(t, T);
  drawScreen();
  const all = aircraftAt(t);
  drawAircraft(all, t);
  dimWorld(smooth(-1.5, -5, logRate(T)));
  const ov = overlays(T);
  const msgs = arrivals(t, all);
  drawShells(t, ov.shellA);
  drawField(msgs, ph, ov);
  const heroOn = msgs.find(m => m.hero);
  if (heroOn) {
    // the energy flow follows the average envelope, not each pulse
    let avg = 0; for (let i = 0; i < 16; i++) avg += envelope(heroOn.bits, heroOn.tau - i * .25); avg /= 16;
    drawStreams(ov.streamA * Math.min(1, avg * 2.2), Tall);
  }
  drawPattern(ov.patternA);
  return { T, t, msgs };
}
// time slowed: the room darkens and greys a little
function dimWorld(k) {
  if (k <= 0) return;
  const m = 1 - .42 * k, sat = 1 - .45 * k;
  for (let i = 0; i < W * H * 3; i += 3) {
    const l = (FB[i] * .3 + FB[i + 1] * .55 + FB[i + 2] * .15);
    FB[i] = (l + (FB[i] - l) * sat) * m; FB[i + 1] = (l + (FB[i + 1] - l) * sat) * m; FB[i + 2] = (l + (FB[i + 2] - l) * sat) * m * 1.04;
  }
}
function drawScreen() {
  const s = LAPTOP.screen;
  // a TN panel: bright square on, washed and dim off axis
  const n = norm(cross(sub(s[1], s[0]), sub(s[3], s[0])));
  const vdir = norm(sub(cam.e, lerp3(s[0], s[2], .5)));
  const k = .45 + .65 * Math.abs(dot(n, vdir));
  const c = [1.05 * k, 1.05 * k, 1.1 * k];
  drawTri(setV(VA, s[0], c, 0, 0), setV(VB, s[1], c, 1, 0), setV(VC, s[2], c, 1, 1), SCREEN, 1, OPAQUE);
  drawTri(setV(VA, s[0], c, 0, 0), setV(VB, s[2], c, 1, 1), setV(VC, s[3], c, 0, 1), SCREEN, 1, OPAQUE);
}

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', resize); resize();

(function init() {
  drawScreenBase();
  shotsAfterBuild();
  const hist = new Uint32Array(32768);
  for (const T of [0, 12, 19.5, 22.05, 24.4, 27.3, 29.6, 31.2, 35, 41, 48]) { renderAt(T); histFrame(hist); }
  buildPalette(hist);
  const fixed = Q.get('t');
  const t0 = performance.now();
  function loop() {
    const T = fixed != null ? +fixed : (performance.now() - t0) / 1000;
    const info = renderAt(T); present();
    if (fixed == null) requestAnimationFrame(loop);
    else { window.INFO = { T: info.T, t: info.t, msgs: info.msgs.map(m => ({ hero: !!m.hero, tau: m.tau, env: m.env, R: m.R })) }; document.title = 'ready'; }
  }
  loop();
})();
